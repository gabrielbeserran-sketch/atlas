[project]
name = "atlas-camera-gateway"
version = "0.1.0"
description = "Gateway físico vendor-neutral para câmera de entrada do Atlas"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
]

[project.scripts]
atlas-camera-gateway = "atlas_camera_gateway.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
