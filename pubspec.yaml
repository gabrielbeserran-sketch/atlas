name: projeto_atlas
description: "Sistema de gestão pecuária Projeto Atlas."
publish_to: 'none'

version: 1.0.0+6

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  http: ^1.2.2
  file_selector: ^1.1.0
  image_picker: ^1.2.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  connectivity_plus: ^6.1.4
  uuid: ^4.5.1
  web_socket_channel: ^3.0.3
  speech_to_text: ^7.4.0
  speech_to_text_windows: ^1.0.1

  # Criação de documentos PDF.
  pdf: ^3.10.8

  # Visualização, impressão e salvamento de PDFs.
  printing: ^5.13.4
  
  excel: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
  fonts:
    - family: AtlasLivestock
      fonts:
        - asset: assets/fonts/AtlasLivestock.ttf
