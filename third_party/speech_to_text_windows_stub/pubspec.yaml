name: speech_to_text_windows
description: Atlas Windows no-op implementation used by the desktop RC.
version: 1.0.1
publish_to: 'none'

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: SpeechToTextWindows
