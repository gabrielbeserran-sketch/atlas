name: Atlas Full CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements.txt}
      - run: pip install -r requirements.txt
      - run: python scripts/quality/run_cycles13_15_gate.py
        env:
          ATLAS_ENV: test
          ATLAS_DATABASE_URL: sqlite:///./atlas_ci.db
          ATLAS_JWT_SECRET: atlas-ci-secret-with-at-least-32-characters
