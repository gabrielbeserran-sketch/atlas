services:
  api:
    build: ../../backend
    env_file: .env.cloud
    restart: unless-stopped
    depends_on: [postgres, redis]
  worker:
    build: ../../backend
    command: python -m app.worker
    env_file: .env.cloud
    restart: unless-stopped
    depends_on: [postgres, redis]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: change-me
    volumes: [atlas_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
volumes:
  atlas_pg:
