services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: atlas
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [atlas_enterprise_db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U atlas"], interval: 10s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: [atlas_enterprise_redis:/data]
  api:
    build: ../../backend
    env_file: .env.enterprise
    command: sh -c "python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
    depends_on: {db: {condition: service_healthy}}
    ports: ["8000:8000"]
    restart: unless-stopped
volumes: {atlas_enterprise_db: {}, atlas_enterprise_redis: {}}
